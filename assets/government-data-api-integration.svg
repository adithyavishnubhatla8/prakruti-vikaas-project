<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">PRAKRUTI VIKAAS — Government Data API Integration</title>
<desc id="desc">Reference architecture from the PRAKRUTI VIKAAS Android application through a secure API integration layer to government and agricultural data sources, followed by normalization, quality checks and farmer-focused market intelligence outputs.</desc>
