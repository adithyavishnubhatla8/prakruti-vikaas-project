 .head{font:700 24px Arial,sans-serif;fill:#fff}.label{font:700 21px Arial,sans-serif;fill:#17452a}
 .body{font:19px Arial,sans-serif;fill:#263d2d}.small{font:16px Arial,sans-serif;fill:#49634c}
 .source{font:700 20px Arial,sans-serif;fill:#17452a}.line{stroke:#367849;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
 .card{fill:#fff;stroke:#9fbea0;stroke-width:2}.pale{fill:#edf5df;stroke:#b7cea7;stroke-width:2}
 </style>
